<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!--
    Знак продукта: щит с тремя полосами разной длины — слои детектирования.
    Заливка сплошная фирменным синим, полосы белые: так знак читается и на
    тёмном полотне, и на светлом, и на вкладке браузера любой темы.
    Раньше щит был почти чёрным (#0d0f14) и на тёмной теме исчезал.
  -->
  <path d="M32 4 L56 12.5 v20.8 C56 46.6 45.6 56.4 32 60 18.4 56.4 8 46.6 8 33.3 V12.5 Z"
        fill="#3B82F6"/>
  <rect x="18" y="21" width="28" height="5.5" rx="1.5" fill="#ffffff"/>
  <rect x="18" y="30" width="20" height="5.5" rx="1.5" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="18" y="39" width="24" height="5.5" rx="1.5" fill="#ffffff" fill-opacity="0.55"/>
</svg>
