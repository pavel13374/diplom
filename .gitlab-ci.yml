# =====================================================================
#  CI-пайплайн стенда Sentinel
# =====================================================================
# Работа посвящена безопасности CI/CD, при этом самого пайплайна у проекта
# не было — этот файл закрывает пробел.
#
# Стадии:
#   lint    — статический анализ (pyflakes) и проверка правил детектирования;
#   test    — набор проверок платформы (run_tests.py): детектор, анти-лик,
#             статистика, численные регрессии, маршруты, дизайн-система;
#   metrics — эксперименты и метрики, артефакты в results/ (не блокируют).
# =====================================================================

stages:
  - lint
  - test
  - metrics

default:
  image: python:3.11-slim
  before_script:
    - python -V
    # БЕЗ `|| true`. С ним провал установки зависимостей был невидим, и job
    # уходил дальше, «успешно» проверяя код без flask/numpy — а проверки,
    # которые от них зависят, молча пропускались и рапортовали PASS.
    - pip install --quiet --no-cache-dir -r requirements.txt
  # Стенд обязан работать без GitLab и без внешней сети.
  variables:
    SOC_OFFLINE: "1"

# ---------------------------------------------------------------------
lint:
  stage: lint
  script:
    - pip install --quiet pyflakes
    # БЕЗ `|| true`: со стоящим рядом allow_failure: false это выглядело как
    # блокирующий линт, а на деле job не мог упасть НИКОГДА.
    - python -m pyflakes $(git ls-files '*.py')
    - echo "— проверка правил детектирования —"
    - python tools/lint_rules.py
  allow_failure: false

# ---------------------------------------------------------------------
# Набор проверок платформы. Стадия была убрана вместе с каталогом tests/ и
# восстановлена: именно она ловит расхождение словаря действий с вектором
# признаков, мёртвые правила и нарушения дизайн-системы — то есть ровно те
# дефекты, которые иначе живут месяцами и не видны глазом.
tests:
  stage: test
  # jsdom нужен проверке страниц: без него она НЕ падает, а молча пропускается,
  # и клиентский JS остаётся непроверенным. Так и вышло — раздел «Тренды» не
  # прогонялся, панель выбора порога висела прочерком, тест был зелёным.
  before_script:
    - python -V
    - pip install --quiet --no-cache-dir -r requirements.txt
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs npm >/dev/null 2>&1
    # jsdom обязателен ИМЕННО ЗДЕСЬ: без него проверки страниц и доступности
    # не падают, а пропускаются, и клиентский JS остаётся непроверенным.
    - npm install --silent jsdom
  script:
    # --strict: пропущенная проверка считается провалом. В CI окружение обязано
    # быть полным, поэтому «пропущено» здесь означает «сломалась подготовка».
    - python run_tests.py --strict
  allow_failure: false

# ---------------------------------------------------------------------
# Проверка воспроизводимости: обучение модели и ablation. Долгие, поэтому
# вынесены в отдельную стадию и не блокируют merge.
experiments:
  stage: metrics
  script:
    - python research/train_runtime_model.py --seeds 2
    - python research/experiments.py --seeds 2
    - python research/experiments_holdout.py
    - python research/experiments_roc.py
  artifacts:
    paths:
      - results/
      - models/
    expire_in: 1 month
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == "main"
