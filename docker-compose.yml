# SOC Purple-Team Platform — одной командой: docker compose up
# Открой: http://127.0.0.1:8787 (среда) и http://127.0.0.1:8788 (Purple Team)
# Пароль печатается в логе контейнера при старте (или задай SOC_ADMIN_PASS).
# LLM-триаж опционален: docker compose --profile llm up
services:
  soc:
    build: .
    container_name: soc-platform
    ports:
      # ТОЛЬКО НА ПЕТЛЮ ХОСТА. Без префикса Docker публикует на 0.0.0.0, и
      # админ-консоль с общим паролем оказывалась доступна всей сети.
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    environment:
      SOC_OFFLINE: "1"
      # Внутри контейнера слушаем все интерфейсы, иначе опубликованные порты
      # ведут в никуда; наружу они выставлены только на 127.0.0.1 (см. ports).
      SOC_WEB_HOST: "0.0.0.0"
      # Пароль НЕ зашит: entrypoint сгенерирует и напечатает. Свой задаётся так:
      #   SOC_ADMIN_PASS=... docker compose up
      SOC_ADMIN_PASS: "${SOC_ADMIN_PASS:-}"
      # если поднят профиль llm — консоль увидит Ollama по имени сервиса:
      OLLAMA_HOST: "http://ollama:11434"
    volumes:
      - soc-data:/app/data          # переживает перезапуск
      - ./reports:/app/reports
      - ./results:/app/results
    restart: unless-stopped

  # Опциональный LLM для объяснимого триажа (тяжёлый; включай осознанно):
  # docker compose --profile llm up
  ollama:
    image: ollama/ollama:latest
    container_name: soc-ollama
    profiles: ["llm"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  soc-data:
  ollama-data:
